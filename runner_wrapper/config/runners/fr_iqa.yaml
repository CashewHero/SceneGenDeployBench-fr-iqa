catalog_version: 1

runners:
  - runner: fr_iqa
    version: 0.1.6
    latest: true
    display_name: Full-Reference Image Quality
    kind: evaluator
    contract_version: 1
    inputs:
      data:
        required_sample:
          required_datatype:
            - image
      candidate:
        required_sample:
          required_datatype:
            - image
    job_parameters:
      metrics: [psnr, ws_psnr, ssim, lpips, dists]
    scheduling:
      max_batch_size: 50
      max_attempts: 1
      job_timeout_minutes: 5
      startup_timeout_minutes: 5
    launcher:
      driver: docker
      compat_version: 1
      image: ghcr.io/cashewhero/scenegendeploybench-fr-iqa:0.1.6
      endpoint:
        port: 58090
      env:
        RUNNER_ADAPTER: runner_wrapper.fr_iqa_adapter:run_job

  - runner: 3dgs_render_iqa
    version: 0.1.6
    latest: true
    display_name: 3DGS Render Image Quality
    kind: evaluator
    contract_version: 1
    inputs:
      data:
        required_sample:
          required_datatype:
            - image
          optional_datatype:
            - camera_pose
      candidate:
        required_sample:
          required_datatype:
            - 3dgs
      references:
        optional_sample:
          required_datatype:
            - image
            - camera_pose
    job_parameters:
      metrics: [psnr, ws_psnr, ssim, lpips, dists]
      scene_scale_overwrite: null
      output_images: true
      max_distance: 50.0
      max_references: 500
    scheduling:
      max_batch_size: 50
      max_attempts: 1
      job_timeout_minutes: 30
      startup_timeout_minutes: 5
    launcher:
      driver: docker
      compat_version: 1
      image: ghcr.io/cashewhero/scenegendeploybench-fr-iqa:0.1.6
      gpus: all
      endpoint:
        port: 58090
      env:
        RUNNER_ADAPTER: runner_wrapper.render_3dgs_adapter:run_job

  - runner: 3dgs_scale_calibration
    version: 0.1.6
    latest: true
    display_name: 3DGS Scale Calibration
    kind: evaluator
    contract_version: 1
    inputs:
      data:
        required_sample:
          optional_datatype:
            - camera_pose
            - depth
      candidate:
        required_sample:
          required_datatype:
            - 3dgs
      references:
        optional_sample:
          required_datatype:
            - camera_pose
          optional_datatype:
            - image
            - depth
    job_parameters:
      comparison_mode: auto
      initial_scene_scale_overwrite: null
      hybrid_depth_weight: 0.7
      scale_range_factor: 1.5
      target_accuracy: 0.001
      search_points_per_round: 11
      max_search_rounds: 10
      max_distance: 10.0
      max_references: 100
      min_ground_truth_depth: 0.1
      max_ground_truth_depth: 50.0
      depth_min_render_alpha: 0.1
      view_distance_weight_half_life: 2.5
      metric: lpips
      save_renders:
        scales: none
        types: ["rgb", "depth", "alpha", "rgb_error", "depth_error", "depth_filter"]
        copy_ground_truth: false
    scheduling:
      max_batch_size: 10
      max_attempts: 1
      job_timeout_minutes: 120
      startup_timeout_minutes: 5
    launcher:
      driver: docker
      compat_version: 1
      image: ghcr.io/cashewhero/scenegendeploybench-fr-iqa:0.1.6
      gpus: all
      endpoint:
        port: 58090
      env:
        RUNNER_ADAPTER: runner_wrapper.scale_calibration_adapter:run_job
